name: Build J.A.R.V.I.S. Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Unpack Jarvis-Gemini-Android.zip if uploaded as ZIP
        run: |
          if [ -f "Jarvis-Gemini-Android.zip" ]; then
            unzip -o Jarvis-Gemini-Android.zip
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter Stable
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Prepare Android Scaffolding & Native Kotlin Bridges
        run: |
          mkdir -p /tmp/jarvis_backup
          cp -r lib pubspec.yaml analysis_options.yaml assets /tmp/jarvis_backup/
          cp -r android/app/src/main /tmp/jarvis_backup/android_main
          flutter create --platforms=android --org com.privateagent --project-name private_agent .
          cp -r /tmp/jarvis_backup/lib .
          cp /tmp/jarvis_backup/pubspec.yaml .
          cp /tmp/jarvis_backup/analysis_options.yaml .
          cp -r /tmp/jarvis_backup/assets .
          cp -r /tmp/jarvis_backup/android_main/* android/app/src/main/
          if [ -f "android/app/build.gradle" ]; then
            sed -i 's/minSdkVersion .*/minSdkVersion 24/g' android/app/build.gradle || true
            sed -i 's/minSdk = .*/minSdk = 24/g' android/app/build.gradle || true
            sed -i 's/minSdk flutter.minSdkVersion/minSdk 24/g' android/app/build.gradle || true
          fi
          if [ -f "android/app/build.gradle.kts" ]; then
            sed -i 's/minSdk = .*/minSdk = 24/g' android/app/build.gradle.kts || true
          fi

      - name: Build Release APK
        run: |
          flutter pub get
          flutter build apk --release --no-tree-shake-icons
          cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/Jarvis-Gemini-v1.1.0-release.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Jarvis-Gemini-Android-APK
          path: build/app/outputs/flutter-apk/Jarvis-Gemini-v1.1.0-release.apk

      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.0-build.${{ github.run_number }}
          name: "J.A.R.V.I.S. (Gemini Edition) v1.1.0 (#${{ github.run_number }})"
          files: build/app/outputs/flutter-apk/Jarvis-Gemini-v1.1.0-release.apk
          
