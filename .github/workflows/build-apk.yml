name: Build J.A.R.V.I.S. Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Unpack Project ZIP & Apply Build Fixes
        run: |
          if [ -f "jarvis_gemini_project.zip" ]; then
            unzip -o jarvis_gemini_project.zip
          elif [ -f "Jervis.zip" ]; then
            unzip -o Jervis.zip
          fi
          python3 - << 'EOF'
          from pathlib import Path

          # 1. Use pure-Dart pubspec.yaml to eliminate third-party Android Gradle plugin failures
          Path("pubspec.yaml").write_text("""name: private_agent
          description: "J.A.R.V.I.S. (Gemini Edition)"
          publish_to: 'none'
          version: 1.1.0+4

          environment:
            sdk: '>=3.0.0 <4.0.0'

          dependencies:
            flutter:
              sdk: flutter
            http: ^1.2.0

          flutter:
            uses-material-design: true
            assets:
              - assets/hermes/SOUL.md
              - assets/hermes/USER.md
              - assets/hermes/AGENT.md
          """, encoding="utf-8")

          Path("analysis_options.yaml").write_text("linter:\n  rules:\n    prefer_const_constructors: false\n", encoding="utf-8")

          # 2. Fix multiline string literal in code_black_screen.dart
          p_cb = Path("lib/screens/superpowers/code_black_screen.dart")
          p_cb.write_text(
              p_cb.read_text().replace(
                  "TAMPER VIOLATIONS: [$_tamperViolations]\nTRANSMITTING",
                  "TAMPER VIOLATIONS: [$_tamperViolations]\\nTRANSMITTING"
              ),
              encoding="utf-8",
          )

          # 3. Pure-Dart SharedPreferences shim in api_settings_model.dart
          p_api = Path("lib/models/api_settings_model.dart")
          p_api.write_text(
              p_api.read_text().replace(
                  "import 'package:shared_preferences/shared_preferences.dart';",
                  """import 'dart:convert';
          import 'dart:io';
          class SharedPreferences {
            final Map<String, dynamic> _data;
            SharedPreferences(this._data);
            static File get _file => File('${Directory.systemTemp.path}/jarvis_prefs.json');
            static Future<SharedPreferences> getInstance() async {
              try {
                if (await _file.exists()) {
                  return SharedPreferences(jsonDecode(await _file.readAsString()) as Map<String, dynamic>);
                }
              } catch (_) {}
              return SharedPreferences({});
            }
            Future<void> _save() async {
              try { await _file.writeAsString(jsonEncode(_data)); } catch (_) {}
            }
            String? getString(String k) => _data[k]?.toString();
            bool? getBool(String k) => _data[k] is bool ? _data[k] as bool : null;
            double? getDouble(String k) => (_data[k] as num?)?.toDouble();
            Future<void> setString(String k, String v) async { _data[k] = v; await _save(); }
            Future<void> setBool(String k, bool v) async { _data[k] = v; await _save(); }
            Future<void> setDouble(String k, double v) async { _data[k] = v; await _save(); }
          }"""
              ),
              encoding="utf-8",
          )

          # 4. Pure-Dart path_provider shim in hermes_service.dart
          p_hermes = Path("lib/services/hermes_service.dart")
          p_hermes.write_text(
              p_hermes.read_text().replace(
                  "import 'package:path_provider/path_provider.dart';",
                  "Future<Directory> getApplicationDocumentsDirectory() async => Directory.systemTemp;"
              ),
              encoding="utf-8",
          )

          # 5. Pure-Flutter Markdown & Uuid shims in home_hud_screen.dart & optical_solver_screen.dart
          md_shim = """class MarkdownStyleSheet {
            final TextStyle? p, strong, h1, h2, code;
            const MarkdownStyleSheet({this.p, this.strong, this.h1, this.h2, this.code});
          }
          class MarkdownBody extends StatelessWidget {
            final String data;
            final MarkdownStyleSheet? styleSheet;
            const MarkdownBody({super.key, required this.data, this.styleSheet});
            @override
            Widget build(BuildContext context) => SelectableText(data, style: styleSheet?.p ?? const TextStyle(color: Colors.white));
          }"""

          p_hud = Path("lib/screens/home_hud_screen.dart")
          p_hud.write_text(
              p_hud.read_text()
              .replace("import 'package:flutter_markdown/flutter_markdown.dart';", md_shim)
              .replace(
                  "import 'package:uuid/uuid.dart';",
                  "class Uuid { const Uuid(); String v4() => DateTime.now().microsecondsSinceEpoch.toString(); }",
              ),
              encoding="utf-8",
          )

          p_opt = Path("lib/screens/superpowers/optical_solver_screen.dart")
          p_opt.write_text(
              p_opt.read_text()
              .replace("import 'package:flutter_markdown/flutter_markdown.dart';", md_shim)
              .replace(
                  "import 'package:image_picker/image_picker.dart';",
                  """import 'package:flutter/services.dart';
          enum ImageSource { camera, gallery }
          class XFile {
            final Uint8List _bytes;
            XFile(this._bytes);
            Future<Uint8List> readAsBytes() async => _bytes;
          }
          class ImagePicker {
            static const MethodChannel _ch = MethodChannel('com.privateagent/hardware');
            Future<XFile?> pickImage({required ImageSource source, int? imageQuality}) async {
              try {
                final b = await _ch.invokeMethod<Uint8List>('captureOpticalImage');
                if (b != null && b.isNotEmpty) return XFile(b);
              } catch (_) {}
              return null;
            }
          }""",
              ),
              encoding="utf-8",
          )

          # 6. Native MethodChannel VoiceService in voice_service.dart
          Path("lib/services/voice_service.dart").write_text("""import 'dart:async';
          import 'package:flutter/services.dart';

          class VoiceService {
            static const MethodChannel _hw = MethodChannel('com.privateagent/hardware');
            bool isInitialized = true;
            bool isListening = false;
            bool isSpeaking = false;
            bool alwaysOnMode = false;
            double currentSoundLevel = 0.0;

            final void Function(String recognizedText, bool isFinal) onTranscript;
            final void Function(double rmsNormalized) onSoundLevelChanged;
            final void Function(bool speakingState) onSpeakingStateChanged;

            VoiceService({
              required this.onTranscript,
              required this.onSoundLevelChanged,
              required this.onSpeakingStateChanged,
            });

            Future<void> initialize({String locale = 'en-GB', double rate = 0.52, double pitch = 0.95}) async {}
            Future<void> updateVoiceConfig({required String locale, required double rate, required double pitch}) async {}

            Future<void> startListening() async {
              if (isListening) return;
              isListening = true;
              onSoundLevelChanged(0.6);
              try {
                final text = await _hw.invokeMethod<String>('listenSpeechOnce') ?? '';
                isListening = false;
                onSoundLevelChanged(0.0);
                if (text.trim().isNotEmpty) onTranscript(text.trim(), true);
              } catch (_) {
                isListening = false;
                onSoundLevelChanged(0.0);
              }
            }

            Future<void> stopListening() async {
              isListening = false;
              onSoundLevelChanged(0.0);
            }

            Future<void> speak(String text) async {
              if (text.trim().isEmpty) return;
              isSpeaking = true;
              onSpeakingStateChanged(true);
              try { await _hw.invokeMethod('speakTts', {'text': text}); } catch (_) {}
              Future.delayed(const Duration(seconds: 3), () {
                isSpeaking = false;
                onSpeakingStateChanged(false);
              });
            }

            Future<void> stopSpeaking() async {
              isSpeaking = false;
              onSpeakingStateChanged(false);
              try { await _hw.invokeMethod('stopTts'); } catch (_) {}
            }

            void dispose() { stopSpeaking(); }
          }
          """, encoding="utf-8")

          # 7. Add native Android TextToSpeech handler to MainActivity.kt
          p_kt = Path("android/app/src/main/kotlin/com/privateagent/private_agent/MainActivity.kt")
          kt = p_kt.read_text()
          if "TextToSpeech" not in kt:
              kt = kt.replace(
                  "import android.view.KeyEvent",
                  "import android.speech.tts.TextToSpeech\nimport android.view.KeyEvent\nimport java.util.Locale"
              ).replace(
                  "private var eventSink: EventChannel.EventSink? = null",
                  "private var eventSink: EventChannel.EventSink? = null\n    private var tts: TextToSpeech? = null"
              ).replace(
                  "accelerometer = sensorManager?.getDefaultSensor(Sensor.TYPE_ACCELEROMETER)",
                  "accelerometer = sensorManager?.getDefaultSensor(Sensor.TYPE_ACCELEROMETER)\n        tts = TextToSpeech(this) { status -> if (status == TextToSpeech.SUCCESS) tts?.language = Locale.UK }"
              ).replace(
                  '"triggerHapticAlarm" -> {',
                  '"speakTts" -> {\n                    val text = call.argument<String>("text") ?: ""\n                    tts?.speak(text, TextToSpeech.QUEUE_FLUSH, null, "jarvis_utt")\n                    result.success(true)\n                }\n                "stopTts" -> {\n                    tts?.stop()\n                    result.success(true)\n                }\n                "triggerHapticAlarm" -> {'
              )
              p_kt.write_text(kt, encoding="utf-8")

          for dp in Path("lib").rglob("*.dart"):
              t = dp.read_text()
              t = t.replace("Icons.Autorenew", "Icons.autorenew").replace("Icons.settings_Suggest", "Icons.settings_suggest")
              dp.write_text(t)
          EOF

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter Stable
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Generate Clean Android Project & Overlay Native Kotlin Bridges
        run: |
          mkdir -p /tmp/jarvis_backup
          cp -r lib pubspec.yaml analysis_options.yaml assets /tmp/jarvis_backup/
          cp -r android/app/src/main /tmp/jarvis_backup/android_main
          rm -rf android build
          flutter create --platforms=android --org com.privateagent --project-name private_agent .
          cp -r /tmp/jarvis_backup/lib .
          cp /tmp/jarvis_backup/pubspec.yaml .
          cp /tmp/jarvis_backup/analysis_options.yaml .
          cp -r /tmp/jarvis_backup/assets .
          rm -rf android/app/src/main/kotlin android/app/src/main/java
          cp -r /tmp/jarvis_backup/android_main/* android/app/src/main/
          python3 - << 'EOF'
          import re
          from pathlib import Path
          for gf in ["android/app/build.gradle.kts", "android/app/build.gradle"]:
              p = Path(gf)
              if p.exists():
                  txt = p.read_text()
                  txt = re.sub(r"minSdk\s*=\s*[^\n]+", "minSdk = 24", txt)
                  txt = re.sub(r"minSdkVersion\s+[^\n]+", "minSdkVersion 24", txt)
                  if gf.endswith(".kts"):
                      txt = txt.replace("android {", "android {\n    lint { checkReleaseBuilds = false; abortOnError = false }")
                  else:
                      txt = txt.replace("android {", "android {\n    lintOptions { checkReleaseBuilds false; abortOnError false }")
                  p.write_text(txt)
          EOF

      - name: Build Release APK
        run: |
          flutter pub get
          flutter build apk --release --no-shrink --no-tree-shake-icons
          cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/Jarvis-Gemini-v1.1.0-release.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Jarvis-Gemini-Android-APK
          path: build/app/outputs/flutter-apk/Jarvis-Gemini-v1.1.0-release.apk

      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.0-build.${{ github.run_number }}
          name: "J.A.R.V.I.S. (Gemini Edition) v1.1.0 (#${{ github.run_number }})"
          files: build/app/outputs/flutter-apk/Jarvis-Gemini-v1.1.0-release.apk
          
