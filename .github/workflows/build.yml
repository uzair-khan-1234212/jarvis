name: Build J.A.R.V.I.S. Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Unpack v2.0 Upgrade ZIP & Clean Dart Syntax
        run: |
          if [ -f "jarvis_gemini_v2_upgrade.zip" ]; then
            unzip -o jarvis_gemini_v2_upgrade.zip
          elif [ -f "jarvis_gemini_project.zip" ]; then
            unzip -o jarvis_gemini_project.zip
          fi
          python3 - << 'EOF'
          import re
          from pathlib import Path

          # 1. Fix non-const crimson parameter inside const TextStyle in danger_suite_screen.dart
          p_danger = Path("lib/screens/superpowers/danger_suite_screen.dart")
          if p_danger.exists():
              p_danger.write_text(
                  p_danger.read_text(encoding="utf-8").replace(
                      "style: const TextStyle(\n                          color: crimson,",
                      "style: TextStyle(\n                          color: crimson,"
                  ),
                  encoding="utf-8",
              )

          # 2. Ensure all import directives appear strictly at the top of every .dart file
          for p in sorted(Path("lib").rglob("*.dart")):
              lines = p.read_text(encoding="utf-8").splitlines()
              imports, body = [], []
              for l in lines:
                  if re.match(r"^\s*import\s+['\"].*['\"].*;\s*$", l):
                      if l.strip() not in imports:
                          imports.append(l.strip())
                  else:
                      body.append(l)
              p.write_text("\n".join(imports) + "\n\n" + "\n".join(body).lstrip("\n") + "\n", encoding="utf-8")
          EOF

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter Stable
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Generate Android Project & Apply v2.0 Cybernetic Icon and Native Bridges
        run: |
          mkdir -p /tmp/jarvis_backup
          cp -r lib pubspec.yaml analysis_options.yaml assets /tmp/jarvis_backup/
          cp -r android/app/src/main /tmp/jarvis_backup/android_main
          rm -rf android build
          flutter create --platforms=android --org com.privateagent --project-name private_agent .
          cp -r /tmp/jarvis_backup/lib .
          cp /tmp/jarvis_backup/pubspec.yaml .
          cp /tmp/jarvis_backup/analysis_options.yaml .
          cp -r /tmp/jarvis_backup/assets .
          rm -rf android/app/src/main/kotlin android/app/src/main/java
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
          cp -r /tmp/jarvis_backup/android_main/* android/app/src/main/
          python3 - << 'EOF'
          import re
          from pathlib import Path
          for gf in ["android/app/build.gradle.kts", "android/app/build.gradle"]:
              p = Path(gf)
              if p.exists():
                  txt = p.read_text()
                  txt = re.sub(r"minSdk\s*=\s*[^\n]+", "minSdk = 24", txt)
                  txt = re.sub(r"minSdkVersion\s+[^\n]+", "minSdkVersion 24", txt)
                  if gf.endswith(".kts"):
                      txt = txt.replace("android {", "android {\n    lint { checkReleaseBuilds = false; abortOnError = false }")
                  else:
                      txt = txt.replace("android {", "android {\n    lintOptions { checkReleaseBuilds false; abortOnError false }")
                  p.write_text(txt)
          EOF

      - name: Build v2.0 Release APK
        run: |
          flutter pub get
          flutter build apk --release --no-tree-shake-icons
          cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/Jarvis-v2.0-release.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Jarvis-v2.0-Android-APK
          path: build/app/outputs/flutter-apk/Jarvis-v2.0-release.apk

      - name: Publish v2.0 APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.0-build.${{ github.run_number }}
          name: "J.A.R.V.I.S. v2.0 (Universal API + Danger Suite) (#${{ github.run_number }})"
          files: build/app/outputs/flutter-apk/Jarvis-v2.0-release.apk
          
